name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from your phone
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Dependencies
        run: |
          npm install

      - name: Prepare Web Directory
        run: |
          # If your files are in the root directory, this copies them into www/
          mkdir -p www
          rsync -av --exclude='www' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='android' --exclude='assets' ./ www/

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android

      - name: Generate App Icons and Splash Assets
        run: |
          if [ -d "assets" ]; then
            npx @capacitor/assets generate --android
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
