<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EtherLog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--primary:#00897b;--bg:#f8fafc;--text:#0f172a;--border:#cbd5e1;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif; -webkit-tap-highlight-color: transparent;}
    body{background:var(--bg);color:var(--text);padding-bottom:90px;}
    header{background:var(--primary);color:white;padding:14px 18px;position:sticky;top:0;z-index:50;}
    header h1{font-size:1.18rem;font-weight:700;display:flex;align-items:center;gap:8px;}
    .container{max-width:800px;margin:0 auto;padding:12px;}
    .card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid var(--border);}
    .form-group{margin-bottom:14px;}
    label{display:block;font-size:0.76rem;font-weight:700;color:#64748b;margin-bottom:5px;text-transform:uppercase;}
    .hint-text{font-size:0.7rem;color:#94a3b8;font-weight:400;text-transform:none;margin-top:2px;}
    input[type="text"],input[type="number"],input[type="date"],input[type="url"],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.95rem;background:#fff;}
    .row{display:flex;gap:10px;}.col{flex:1;}
    .pill-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
    .pill-label{display:inline-block;cursor:pointer;}.pill-label input{display:none;}
    .pill-span{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:20px;font-size:0.82rem;font-weight:600;background:#e2e8f0;color:#334155;border:1.5px solid var(--border); transition:0.1s;}
    
    .pill-label input[type="radio"]:checked+.pill-span{background:#00897b!important;color:white!important;border-color:#004d40!important;}
    .pill-label.comorbid input[type="checkbox"]:checked+.pill-span{background:#0284c7!important;color:white!important;border-color:#0369a1!important;}
    .pill-label.analgesia input[type="checkbox"]:checked+.pill-span{background:#059669!important;color:white!important;border-color:#047857!important;}
    .pill-label.comp input[type="checkbox"]:checked+.pill-span{background:#ef4444!important;color:white!important;border-color:#b91c1c!important;}
    .pill-label.comp input[value="Nil"]:checked+.pill-span{background:#10b981!important;color:white!important;border-color:#047857!important;}
    
    .conditional-box{background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:10px;padding:12px;margin-top:6px;}
    
    nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:white;border-top:2px solid var(--border);display:flex;z-index:9999;}
    .nav-btn{background:none;border:none;color:#64748b;display:flex;flex-direction:column;align-items:center;font-size:0.75rem;gap:4px;cursor:pointer;flex:1;height:100%;justify-content:center;}
    .nav-btn.active{color:var(--primary)!important;font-weight:700;}
    .nav-btn * { pointer-events: none; } /* Prevents touch conflicts */
