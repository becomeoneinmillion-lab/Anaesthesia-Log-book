<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EtherLog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--pri:#00897b;--bg:#f8fafc;--txt:#0f172a;--bdr:#cbd5e1;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:var(--bg);color:var(--txt);padding-bottom:90px;}
    header{background:var(--pri);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;}
    header h1{font-size:1.18rem;font-weight:700;display:flex;align-items:center;gap:8px;}
    .container{max-width:800px;margin:0 auto;padding:12px;}
    .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid var(--bdr);}
    .fg{margin-bottom:14px;}
    .lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
    label{display:block;font-size:0.75rem;font-weight:700;color:#64748b;margin-bottom:5px;text-transform:uppercase;}
    input[type="text"],input[type="number"],input[type="date"],input[type="url"],select{width:100%;padding:10px;border:1px solid var(--bdr);border-radius:8px;font-size:0.95rem;background:#fff;}
    .row{display:flex;gap:10px;}.col{flex:1;}
    .pill-group{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
    .pill-lbl{display:inline-block;cursor:pointer;}.pill-lbl input{display:none;}
    .pill-sp{display:inline-flex;padding:7px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;background:#e2e8f0;color:#334155;border:1.5px solid var(--bdr);}
    .pill-lbl input[type="radio"]:checked+.pill-sp{background:#00897b!important;color:#fff!important;border-color:#004d40!important;}
    .pill-lbl.comorbid input:checked+.pill-sp{background:#0284c7!important;color:#fff!important;border-color:#0369a1!important;}
    .pill-lbl.analgesia input:checked+.pill-sp{background:#059669!important;color:#fff!important;border-color:#047857!important;}
    .pill-lbl.comp input:checked+.pill-sp{background:#ef4444!important;color:#fff!important;border-color:#b91c1c!important;}
    .pill-lbl.comp input[value="Nil"]:checked+.pill-sp,.pill-lbl.comorbid input[value="Nil"]:checked+.pill-sp{background:#10b981!important;color:#fff!important;border-color:#047857!important;}
    .cond-box{background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:10px;padding:12px;margin-bottom:14px;display:none;}
    nav.b-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:2px solid var(--bdr);display:flex;z-index:999;}
    .nav-btn{background:none;border:none;color:#64748b;display:flex;flex-direction:column;align-items:center;font-size:0.75rem;gap:4px;cursor:pointer;flex:1;justify-content:center;}
    .nav-btn.active{color:var(--pri)!important;font-weight:700;}
    .btn{width:100%;padding:12px;border-radius:8px;font-size:1rem;font-weight:600;border:none;cursor:pointer;background:var(--pri);color:#fff;}
    .btn-sec{background:#e2e8f0;color:var(--txt);margin-top:8px;}
    .mini-btn{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;padding:3px 8px;border-radius:6px;font-size:0.72rem;font-weight:700;cursor:pointer;}
    .case-item{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px;}
    .d-box{background:#f8fafc;border-radius:6px;padding:8px 10px;margin:8px 0;font-size:0.83rem;line-height:1.4;border-left:3px solid var(--pri);}
    .act-btn{display:inline-flex;align-items:center;gap:5px;font-size:0.8rem;padding:6px 11px;border-radius:6px;text-decoration:none;font-weight:600;border:none;cursor:pointer;margin:6px 6px 0 0;}
    .thumb-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
    .thumb-img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:2px solid var(--pri);cursor:pointer;}
    #modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;}
    #modalOverlay img{max-width:100%;max-height:80vh;border-radius:8px;object-fit:contain;}
  </style>
</head>
<body>
  <header><h1><i class="fa-solid fa-syringe"></i> EtherLog</h1></header>
  <div id="modalOverlay" onclick="this.style.display='none'">
    <img id="modalImg" src="">
    <div style="margin-top:12px;display:flex;gap:10px">
      <a id="modalDriveBtn" href="#" target="_blank" class="act-btn" style="background:#0284c7;color:#fff;padding:8px 14px" onclick="event.stopPropagation()"><i class="fa-solid fa-up-right-from-square"></i> Open in Google Drive</a>
      <button type="button" class="act-btn" style="background:#ef4444;color:#fff;padding:8px 14px">Close Preview</button>
    </div>
  </div>
  <div class="container">
    <div id="tabLogger">
      <div class="card">
        <h2 id="formTitle" style="font-size:1.12rem;margin-bottom:12px;">Log Anesthetic Case</h2>
        <input type="hidden" id="editId" value="">
        <div class="row">
          <div class="fg col"><label>Date</label><input type="date" id="cDate"></div>
          <div class="fg col"><label>Elective / Emergency</label><select id="cPrio"><option>Elective</option><option>Emergency</option></select></div>
        </div>
        <div class="row">
          <div class="fg col"><label>Patient Age</label><input type="number" id="cAge" placeholder="e.g. 45"></div>
          <div class="fg col"><label>Sex</label><select id="cSex"><option>Male</option><option>Female</option><option>Other</option></select></div>
        </div>
        <div class="fg">
          <div class="lbl-row"><label style="margin:0">Surgical Procedure</label><button type="button" class="mini-btn" onclick="addCustom('proc')">+ Add Custom</button></div>
          <input type="text" id="cProc" list="procList" placeholder="Start typing or select procedure...">
          <datalist id="procList"></datalist>
        </div>
        <div class="row">
          <div class="fg col"><label>Specialty</label><select id="cSpec"></select></div>
          <div class="fg col"><label>Supervision</label><select id="cSup"><option>Independent (Sole)</option><option>Direct Supervision</option><option>Indirect Supervision</option></select></div>
        </div>
        <div class="fg"><label>ASA Physical Status</label><div class="pill-group" id="asaPills"></div></div>
        <div class="fg"><label>Comorbidities</label><div class="pill-group" id="comorbidPills"></div><input type="text" id="cComOther" placeholder="Other comorbidities..." style="margin-top:8px"></div>
        <div class="fg">
          <div class="lbl-row"><label style="margin:0">Anaesthesia Technique</label><button type="button" class="mini-btn" onclick="addCustom('tech')">+ Add Custom</button></div>
          <input type="text" id="cTech" list="techList" placeholder="Start typing technique (e.g. ETT, USG right...)" oninput="checkAirway()">
          <datalist id="techList"></datalist>
        </div>
        <div id="airwayBox" class="cond-box">
          <label style="color:var(--pri)">Airway Management (GA / ETT / LMA)</label>
          <div class="row" style="margin-top:6px">
            <div class="fg col"><label>Pre-op MMS</label><select id="cMMS"><option>1</option><option>2</option><option>3</option><option>4</option><option>0</option><option>Not Assessed</option></select></div>
            <div class="fg col"><label>Cormack-Lehane</label><select id="cCL"><option>1</option><option>2</option><option>2a</option><option>2b</option><option>3a</option><option>3b</option><option>4</option></select></div>
          </div>
          <input type="text" id="cAirNotes" placeholder="Tube size, blade, intubation notes...">
        </div>
        <div class="fg"><label>Difficult Airway / Special Notes</label><input type="text" id="cDiff" placeholder="e.g. C-MAC, Bougie, Arterial line (or Nil)"></div>
        <div class="fg"><label>Analgesia</label><div class="pill-group" id="analgPills"></div><input type="text" id="cAnalgOther" placeholder="Other analgesia / blocks / doses..." style="margin-top:8px"></div>
        <div class="fg"><label>Complications</label><div class="pill-group" id="compPills"></div><input type="text" id="cCompOther" placeholder="Other complications / management..." style="margin-top:8px"></div>
        <div class="fg">
          <label>Attach OT Record Sheet (Photo / PDF)</label>
          <input type="file" id="cFiles" accept="image/*,application/pdf" multiple style="padding:6px 0">
          <div id="currFiles" style="margin-top:4px"></div>
        </div>
        <button type="button" class="btn" id="saveBtn" onclick="saveCase()">Save & Log Case</button>
        <button type="button" class="btn btn-sec" id="cancelBtn" onclick="resetForm();showTab('tabLedger')" style="display:none">Cancel Edit</button>
      </div>
    </div>
    <div id="tabLedger" style="display:none">
      <div class="lbl-row" style="margin-bottom:12px"><h2>My Logbook Records</h2><button type="button" class="mini-btn" style="padding:6px 12px;font-size:0.8rem" onclick="exportCSV()">Export CSV</button></div>
      <div id="ledgerList"></div>
    </div>
    <div id="tabSettings" style="display:none">
      <div class="card">
        <h2 style="font-size:1.1rem;margin-bottom:12px">Google Drive Settings</h2>
        <div class="fg"><label>Google Apps Script Web App URL</label><input type="url" id="sUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
        <button type="button" class="btn" onclick="localStorage.setItem('el_url',document.getElementById('sUrl').value.trim());localStorage.setItem('etherlog_script_url',document.getElementById('sUrl').value.trim());alert('Drive Script URL Saved!')">Save URL</button>
      </div>
    </div>
  </div>
  <nav class="b-nav">
    <button type="button" class="nav-btn active" id="nav0" onclick="showTab('tabLogger')"><i class="fa-solid fa-notes-medical"></i><span>Log Case</span></button>
    <button type="button" class="nav-btn" id="nav1" onclick="showTab('tabLedger')"><i class="fa-solid fa-book-medical"></i><span>Ledger</span></button>
    <button type="button" class="nav-btn" id="nav2" onclick="showTab('tabSettings')"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
  </nav>
  <script>
    const getLS = (k,d=[]) => { try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d} };
    const setLS = (k,v) => localStorage.setItem(k,JSON.stringify(v));
    let curLinks = [];
    const PROCS = ["Laparoscopic Appendicectomy","Open Appendicectomy","Laparoscopic Cholecystectomy","Exploratory Laparotomy","Inguinal Hernia Repair","Total Thyroidectomy","Modified Radical Mastectomy (MRM)","Total Knee Arthroplasty (TKA)","Total Hip Arthroplasty (THA)","DHS / PFN Femur Fixation","ORIF Both Bones Forearm / Tibia","Elective LSCS","Emergency LSCS","Total Abdominal Hysterectomy (TAH)","Total Laparoscopic Hysterectomy (TLH)","Tonsillectomy","FESS","Tympanoplasty / Mastoidectomy","TURP","URSL / PCNL","Craniotomy","Lumbar Discectomy / Laminectomy","Split Skin Grafting (SSG)"];
    const TECHS = ["General Anaesthesia (GA) - ETT","General Anaesthesia (GA) - RSI ETT","General Anaesthesia (GA) - Nasotracheal ETT","General Anaesthesia (GA) - DLT","General Anaesthesia (GA) - LMA / SGA","General Anaesthesia (GA) - TIVA","Subarachnoid Block (Spinal)","Epidural Anaesthesia (Lumbar)","Epidural Anaesthesia (Thoracic)","Combined Spinal-Epidural (CSE)","Caudal Epidural","USG guided Right Supraclavicular Brachial Plexus Block","USG guided Left Supraclavicular Brachial Plexus Block","Landmark guided Right Supraclavicular Brachial Plexus Block","Landmark guided Left Supraclavicular Brachial Plexus Block","USG guided Right Interscalene Block","USG guided Left Interscalene Block","USG guided Right Infraclavicular Block","USG guided Left Infraclavicular Block","USG guided Right Axillary Block","USG guided Left Axillary Block","USG guided Bilateral TAP Block","USG guided Right TAP Block","USG guided Left TAP Block","USG guided Bilateral Rectus Sheath Block","USG guided Bilateral ESP Block","USG guided Right Femoral Nerve Block","USG guided Left Femoral Nerve Block","USG guided Right Adductor Canal Block (ACB)","USG guided Left Adductor Canal Block (ACB)","USG guided Right Sciatic Block (Popliteal)","USG guided Left Sciatic Block (Popliteal)","USG guided Right PENG / FICB Block","USG guided Left PENG / FICB Block","Monitored Anesthesia Care (MAC) / Sedation","Local Infiltration / Field Block"];
    function init() {
      document.getElementById('cDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('sUrl').value = localStorage.getItem('el_url') || localStorage.getItem('etherlog_script_url') || '';
      document.getElementById('cSpec').innerHTML = ["General Surgery","Orthopaedics","Obstetrics & Gynaec","ENT","Urology","Paediatrics","Neuro/Spine","Plastic Surgery","Ophthalmology","Cardiothoracic","Emergency/Trauma"].map(s=>`<option>${s}</option>`).join('');
      makePills('asaPills','asa',['I','II','III','IV','V','I E','II E','III E','IV E'],'radio','I');
      makePills('comorbidPills','comorbid',['Nil','T2DM','SHTN','Asthma','Anaemia','Seizure Disorder','Hypothyroidism','Hyperthyroidism','CKD','CAD','CLD','COPD','AKI','Obesity/OSA','GERD'],'checkbox','Nil');
      makePills('analgPills','analgesia',['Nil','IV Paracetamol','IV NSAID','IV Opioid','IV Multimodal','Regional Block','Local Infiltration','Epidural Infusion','IV PCA'],'checkbox','Nil');
      makePills('compPills','comp',['Nil','Hypotension','Bradycardia','Desaturation','Bronchospasm','Laryngospasm','Difficult Intubation','High Spinal','PDPH','PONV'],'checkbox','Nil');
      renderLists();
    }
    function renderLists() {
      document.getElementById('procList').innerHTML = [...new Set([...PROCS,...getLS('el_procs')])].map(x=>`<option value="${x}">`).join('');
      document.getElementById('techList').innerHTML = [...new Set([...TECHS,...getLS('el_techs')])].map(x=>`<option value="${x}">`).join('');
    }
    function makePills(id,name,arr,type,def) {
      document.getElementById(id).innerHTML = arr.map(v=>`<label class="pill-lbl ${name}"><input type="${type}" name="${name}" value="${v}" ${v===def?'checked':''} onchange="pillClick(this,'${name}')"><span class="pill-sp">${v}</span></label>`).join('');
    }
    function pillClick(el,name) {
      if(el.type==='radio') return;
      if(el.value==='Nil' && el.checked) document.querySelectorAll(`input[name="${name}"]`).forEach(c=>{if(c!==el)c.checked=false});
      else if(el.value!=='Nil' && el.checked) { const n=document.querySelector(`input[name="${name}"][value="Nil"]`); if(n) n.checked=false; }
    }
    function addCustom(type) {
      const val = prompt(type==='proc' ? "Enter new Surgical Procedure:" : "Enter new Anaesthesia Technique:");
      if(!val || !val.trim()) return;
      const key = type==='proc' ? 'el_procs' : 'el_techs';
      setLS(key, [...new Set([...getLS(key), val.trim()])]); renderLists();
      document.getElementById(type==='proc' ? 'cProc' : 'cTech').value = val.trim(); checkAirway();
    }
    function checkAirway() {
      const v = document.getElementById('cTech').value.toUpperCase();
      document.getElementById('airwayBox').style.display = /GA|GENERAL|ETT|LMA|SGA|TIVA|DLT/.test(v) ? 'block' : 'none';
    }
    function showTab(id) {
      ['tabLogger','tabLedger','tabSettings'].forEach((t,i) => {
        document.getElementById(t).style.display = (t===id) ? 'block' : 'none';
        document.getElementById('nav'+i).classList.toggle('active', t===id);
      });
      if(id==='tabLedger') renderLedger();
      window.scrollTo(0,0);
    }
    function compressFile(f) {
      if(f.type==='application/pdf') return new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({b64:rd.result,mime:f.type});rd.readAsDataURL(f)});
      return new Promise(r=>{
        const rd=new FileReader(); rd.onload=e=>{
          const img=new Image(); img.onload=()=>{
            const cv=document.createElement('canvas'); let w=img.width, h=img.height;
            if(w>1100){h=Math.round(h*1100/w);w=1100;} cv.width=w; cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h); r({b64:cv.toDataURL('image/jpeg',0.65),mime:'image/jpeg'});
          }; img.src=e.target.result;
        }; rd.readAsDataURL(f);
      });
    }
    function openPreview(src, driveUrl) {
      document.getElementById('modalImg').src = src;
      const dBtn = document.getElementById('modalDriveBtn');
      if(driveUrl && driveUrl.startsWith('http')) { dBtn.href = driveUrl; dBtn.style.display = 'inline-flex'; } else dBtn.style.display = 'none';
      document.getElementById('modalOverlay').style.display = 'flex';
    }
    async function saveCase() {
      const proc = document.getElementById('cProc').value.trim();
      if(!proc) return alert("Enter Surgical Procedure");
      const tech = document.getElementById('cTech').value.trim() || "General Anaesthesia (GA) - ETT";
      setLS('el_procs',[...new Set([...getLS('el_procs'),proc])]); setLS('el_techs',[...new Set([...getLS('el_techs'),tech])]); renderLists();
      const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = "Processing & Uploading...";
      const files = document.getElementById('cFiles').files;
      const url = (localStorage.getItem('el_url') || localStorage.getItem('etherlog_script_url') || '').trim();
      let links = [...curLinks];
      if(files.length > 0) {
        if(!url) alert("Note: Google Drive URL is not set in Settings! Photo will be saved locally for preview, but add your Script URL in Settings for Cloud CSV links.");
        for(let f of files) {
          try {
            const {b64, mime} = await compressFile(f);
            let dUrl = '';
            if(url) {
              try {
                const res = await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fileName:`Case_${Date.now()}_${f.name.replace(/\s+/g,'_')}`,mimeType:mime,base64Data:b64.split(',')[1]})});
                const j = await res.json(); if(j.status==='success') dUrl = j.viewUrl;
              } catch(err) { console.error(err); }
            }
            links.push({url: dUrl, thumb: b64, name: f.name});
          } catch(e){ console.error(e); }
        }
      }
      const getChecked = (n,oth) => {
        let a = Array.from(document.querySelectorAll(`input[name="${n}"]:checked`)).map(c=>c.value);
        let o = document.getElementById(oth).value.trim(); if(o) a.push(o);
        return a.join(', ') || 'Nil';
      };
      const isAir = /GA|GENERAL|ETT|LMA|SGA|TIVA|DLT/.test(tech.toUpperCase());
      const eid = document.getElementById('editId').value;
      const rec = {
        id: eid || ('C'+Date.now()), date: document.getElementById('cDate').value, prio: document.getElementById('cPrio').value,
        age: document.getElementById('cAge').value||'N/A', sex: document.getElementById('cSex').value, proc, spec: document.getElementById('cSpec').value,
        sup: document.getElementById('cSup').value, asa: document.querySelector('input[name="asa"]:checked')?.value||'I',
        comorbid: getChecked('comorbid','cComOther'), tech,
        airway: isAir ? `MMS: ${document.getElementById('cMMS').value} | CL: ${document.getElementById('cCL').value} ${document.getElementById('cAirNotes').value}` : 'N/A',
        diff: document.getElementById('cDiff').value.trim()||'Nil', analg: getChecked('analgesia','cAnalgOther'), comp: getChecked('comp','cCompOther'), links
      };
      let cases = getLS('el_cases');
      if(eid) { const i = cases.findIndex(x=>x.id===eid); if(i>-1) cases[i]=rec; } else cases.unshift(rec);
      setLS('el_cases',cases); btn.disabled=false; btn.textContent="Save & Log Case"; resetForm(); showTab('tabLedger');
    }
    function resetForm() {
      document.getElementById('editId').value=''; document.getElementById('formTitle').textContent='Log Anesthetic Case';
      document.getElementById('cancelBtn').style.display='none'; document.getElementById('currFiles').innerHTML=''; curLinks=[];
      ['cProc','cAge','cTech','cComOther','cAnalgOther','cCompOther','cAirNotes','cDiff','cFiles'].forEach(id=>document.getElementById(id).value='');
      init(); checkAirway();
    }
    function renderLedger() {
      const cases = getLS('el_cases'); const box = document.getElementById('ledgerList');
      if(!cases.length) return box.innerHTML = '<p style="text-align:center;color:#64748b;padding:30px">No cases logged yet.</p>';
      window._cases = cases;
      box.innerHTML = cases.map((c,ci) => {
        const raw = c.links || (c.attachmentUrl ? [c.attachmentUrl] : []);
        const thumbs = raw.map((item,fi) => {
          const isObj = typeof item === 'object' && item !== null;
          const tSrc = isObj ? item.thumb : item;
          const dUrl = isObj ? item.url : item;
          if(tSrc && tSrc.startsWith('data:image')) {
            return `<img src="${tSrc}" class="thumb-img" onclick="openPreview(window._cases[${ci}].links[${fi}].thumb, window._cases[${ci}].links[${fi}].url)" title="Tap to preview"><button type="button" class="act-btn" style="background:#0284c7;color:#fff" onclick="openPreview(window._cases[${ci}].links[${fi}].thumb, window._cases[${ci}].links[${fi}].url)"><i class="fa-solid fa-eye"></i> Preview Sheet ${fi+1}</button>${dUrl?`<a href="${dUrl}" target="_blank" class="act-btn" style="background:#0d9488;color:#fff"><i class="fa-solid fa-cloud"></i> Drive Link ${fi+1}</a>`:''}`;
          }
          return dUrl ? `<a href="${dUrl}" target="_blank" class="act-btn" style="background:#0284c7;color:#fff"><i class="fa-solid fa-file-pdf"></i> Open Sheet ${fi+1}</a>` : '';
        }).join('');
        return `<div class="case-item">
          <div class="lbl-row"><strong>${c.proc||c.procedure}</strong><span><span class="mini-btn">${c.prio||c.priority||'Elective'}</span> <span class="mini-btn">ASA ${c.asa}</span></span></div>
          <div style="font-size:0.8rem;color:#64748b;margin:4px 0">${c.date} | ${c.age}Y / ${c.sex} | ${c.spec||c.specialty} (${c.sup||c.supervision})</div>
          <div style="font-size:0.85rem"><strong>Technique:</strong> ${c.tech||c.technique}</div>
          <div class="d-box">
            <div><strong>Comorbidities:</strong> ${c.comorbid||c.comorbidities||'Nil'}</div>
            ${c.airway&&c.airway!=='N/A'?`<div><strong>Airway:</strong> ${c.airway}</div>`:''}
            <div><strong>Difficult Airway/Notes:</strong> ${c.diff||c.difficultAirway||'Nil'}</div>
            <div><strong>Analgesia:</strong> ${c.analg||c.analgesia||'Nil'}</div>
            <div><strong>Complications:</strong> ${c.comp||c.complications||'Nil'}</div>
          </div>
          ${thumbs ? `<div class="thumb-row">${thumbs}</div>` : ''}
          <div><button type="button" class="act-btn" style="background:#e2e8f0" onclick="editCase('${c.id}')"><i class="fa-solid fa-pen"></i> Edit / Add File</button><button type="button" class="act-btn" style="background:#fee2e2;color:#dc2626" onclick="delCase('${c.id}')"><i class="fa-solid fa-trash"></i></button></div>
        </div>`;
      }).join('');
    }
    function editCase(id) {
      const c = getLS('el_cases').find(x=>x.id===id); if(!c) return;
      document.getElementById('editId').value = c.id; document.getElementById('formTitle').textContent = 'Edit Case / Add Files';
      document.getElementById('cancelBtn').style.display = 'block';
      document.getElementById('cDate').value = c.date; document.getElementById('cPrio').value = c.prio||c.priority||'Elective';
      document.getElementById('cAge').value = c.age!=='N/A'?c.age:''; document.getElementById('cSex').value = c.sex||'Male';
      document.getElementById('cProc').value = c.proc||c.procedure||''; document.getElementById('cSpec').value = c.spec||c.specialty||'General Surgery';
      document.getElementById('cSup').value = c.sup||c.supervision||'Independent (Sole)'; document.getElementById('cTech').value = c.tech||c.technique||'';
      document.getElementById('cDiff').value = (c.diff||c.difficultAirway)==='Nil'?'':(c.diff||c.difficultAirway||'');
      const setP = (n,str) => { const arr=(str||'').split(', '); document.querySelectorAll(`input[name="${n}"]`).forEach(el=>el.checked=arr.includes(el.value)); };
      setP('asa',c.asa); setP('comorbid',c.comorbid||c.comorbidities); setP('analgesia',c.analg||c.analgesia); setP('comp',c.comp||c.complications);
      curLinks = c.links || (c.attachmentUrl?[c.attachmentUrl]:[]);
      document.getElementById('currFiles').innerHTML = curLinks.length ? `<span style="font-size:0.78rem;color:#059669">${curLinks.length} file(s) attached. <u onclick="curLinks=[];document.getElementById('currFiles').innerHTML='Cleared.'" style="cursor:pointer;color:#dc2626">Clear all</u></span>` : '';
      checkAirway(); showTab('tabLogger');
    }
    function delCase(id) { if(confirm("Delete case?")) { setLS('el_cases',getLS('el_cases').filter(x=>x.id!==id)); renderLedger(); } }
    function exportCSV() {
      const cases = getLS('el_cases'); if(!cases.length) return alert("No cases!");
      let csv = "Date,Priority,Age,Sex,Procedure,Specialty,Supervision,ASA,Comorbidities,Technique,Airway,DifficultAirway,Analgesia,Complications,OT_Sheet_Drive_Links\n";
      cases.forEach(c => {
        const lks = (c.links||[]).map(x => (typeof x==='object' ? (x.url || 'Saved Locally on Device') : x)).join(' | ');
        csv += `"${c.date}","${c.prio||''}","${c.age}","${c.sex}","${c.proc||c.procedure}","${c.spec||''}","${c.sup||''}","${c.asa}","${c.comorbid||''}","${c.tech||''}","${c.airway||''}","${c.diff||''}","${c.analg||''}","${c.comp||''}","${lks}"\n`;
      });
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'Anesthesia_Logbook.csv'; a.click();
    }
    init();
  </script>
</body>
