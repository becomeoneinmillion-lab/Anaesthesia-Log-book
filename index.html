<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EtherLog - Anesthesia Logbook</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #00897b;
      --bg: #f8fafc;
      --text: #0f172a;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 85px; }
    
    header { background: var(--primary); color: white; padding: 14px 18px; display: flex; align-items: center; position: sticky; top: 0; z-index: 50; }
    header h1 { font-size: 1.18rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .container { max-width: 800px; margin: 0 auto; padding: 12px; }
    .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
    
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.76rem; font-weight: 700; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
    input[type="text"], input[type="number"], input[type="date"], input[type="url"], select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #fff; }
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }
    
    /* Native Pill Architecture (Zero JS failure risk) */
    .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .pill-label { display: inline-block; cursor: pointer; }
    .pill-label input[type="radio"], .pill-label input[type="checkbox"] { display: none; }
    .pill-span { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; background: #e2e8f0; color: #334155; border: 1.5px solid #cbd5e1; transition: all 0.1s; }
    
    /* When Checked (Native CSS state) */
    .pill-label input[type="radio"]:checked + .pill-span { background: #00897b !important; color: #ffffff !important; border-color: #004d40 !important; font-weight: 700; }
    .pill-label.comorbid input[type="checkbox"]:checked + .pill-span { background: #0284c7 !important; color: #ffffff !important; border-color: #0369a1 !important; font-weight: 700; }
    
    /* Bottom Navigation */
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: white; border-top: 1px solid var(--border); display: flex; z-index: 9999; }
    .nav-btn { background: none; border: none; color: #64748b; display: flex; flex-direction: column; align-items: center; font-size: 0.72rem; gap: 4px; cursor: pointer; flex: 1; height: 100%; justify-content: center; }
    .nav-btn.active { color: var(--primary) !important; font-weight: 700; }
    .nav-btn i { font-size: 1.25rem; }

    .btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); margin-top: 8px; }

    /* Ledger Cards */
    .case-item { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .case-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-emergency { background: #fee2e2; color: #b91c1c; }
    .badge-elective { background: #dcfce7; color: #15803d; }
    .details-box { background: #f8fafc; border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 0.83rem; line-height: 1.4; border-left: 3px solid var(--primary); }
    .action-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; margin-right: 6px; margin-top: 6px; }
    .btn-view-doc { background: #0284c7; color: white; }
    .btn-edit { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-delete { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-syringe"></i> EtherLog</h1>
  </header>

  <div class="container">
    
    <!-- Tab 1: Logger -->
    <div id="tabLogger">
      <div class="card">
        <h2 id="formTitle" style="font-size:1.15rem; margin-bottom: 14px;">Log Anesthetic Case</h2>
        <input type="hidden" id="editCaseId" value="">

        <div class="row">
          <div class="form-group col">
            <label>Date</label>
            <input type="date" id="caseDate">
          </div>
          <div class="form-group col">
            <label>Case Priority</label>
            <select id="casePriority">
              <option value="Elective">Elective</option>
              <option value="Emergency">Emergency</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="form-group col">
            <label>Patient Age</label>
            <input type="number" id="patientAge" placeholder="e.g. 45">
          </div>
          <div class="form-group col">
            <label>Sex</label>
            <select id="patientSex">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Surgical Procedure</label>
          <input type="text" id="procedureName" placeholder="e.g. Laparoscopic Appendicectomy">
        </div>

        <div class="row">
          <div class="form-group col">
            <label>Specialty</label>
            <select id="surgicalSpecialty">
              <option value="General Surgery">General Surgery</option>
              <option value="Orthopaedics">Orthopaedics</option>
              <option value="Obstetrics & Gynaec">Obstetrics & Gynaec</option>
              <option value="ENT">ENT</option>
              <option value="Urology">Urology</option>
              <option value="Paediatrics">Paediatrics</option>
              <option value="Neuro/Spine">Neuro/Spine</option>
              <option value="Plastic Surgery">Plastic Surgery</option>
              <option value="Ophthalmology">Ophthalmology</option>
              <option value="Emergency/Trauma">Emergency/Trauma</option>
            </select>
          </div>
          <div class="form-group col">
            <label>Supervision</label>
            <select id="supervision">
              <option value="Independent (Sole)">Independent (Sole)</option>
              <option value="Direct Supervision">Direct Supervision</option>
              <option value="Indirect Supervision">Indirect Supervision</option>
            </select>
          </div>
        </div>

        <!-- ASA Radio Group (Instant Highlight) -->
        <div class="form-group">
          <label>ASA Physical Status</label>
          <div class="pill-group">
            <label class="pill-label"><input type="radio" name="asaRadio" value="I" checked><span class="pill-span">I</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="II"><span class="pill-span">II</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="III"><span class="pill-span">III</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="IV"><span class="pill-span">IV</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="V"><span class="pill-span">V</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="I E"><span class="pill-span">I E</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="II E"><span class="pill-span">II E</span></label>
            <label class="pill-label"><input type="radio" name="asaRadio" value="III E"><span class="pill-span">III E</span></label>
          </div>
        </div>

        <!-- Comorbidities Checkbox Group (Instant Highlight) -->
        <div class="form-group">
          <label>Comorbidities (Tap to select)</label>
          <div class="pill-group">
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="T2DM"><span class="pill-span">T2DM</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="SHTN"><span class="pill-span">SHTN</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Asthma"><span class="pill-span">Asthma</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Anaemia"><span class="pill-span">Anaemia</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Hypothyroidism"><span class="pill-span">Hypothyroidism</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Hyperthyroidism"><span class="pill-span">Hyperthyroidism</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Seizure Disorder"><span class="pill-span">Seizure Disorder</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="CAD"><span class="pill-span">CAD</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="COPD"><span class="pill-span">COPD</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="CKD"><span class="pill-span">CKD</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="AKI"><span class="pill-span">AKI</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="CLD"><span class="pill-span">CLD</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="Obesity/OSA"><span class="pill-span">Obesity / OSA</span></label>
            <label class="pill-label comorbid"><input type="checkbox" name="comorbidBox" value="GERD"><span class="pill-span">GERD</span></label>
          </div>
          <input type="text" id="comorbidOther" placeholder="Other comorbidities (if any)..." style="margin-top: 8px;">
        </div>

        <div class="form-group">
          <label>Primary Anaesthetic Technique</label>
          <select id="technique">
            <option value="GA - ETT">General Anaesthesia (ETT)</option>
            <option value="GA - LMA/SGA">General Anaesthesia (LMA/SGA)</option>
            <option value="Subarachnoid Block (Spinal)">Subarachnoid Block (Spinal)</option>
            <option value="Epidural / CSE">Epidural / CSE</option>
            <option value="USG Peripheral Nerve Block">USG Peripheral Nerve Block</option>
            <option value="Monitored Anesthesia Care (MAC)">MAC / Sedation</option>
            <option value="Local / Field Block">Local / Field Block</option>
          </select>
        </div>

        <div class="form-group">
          <label>Airway Management Notes</label>
          <input type="text" id="airwayNotes" placeholder="e.g. Mallampati II, Mac 3 blade, 7.5 ETT">
        </div>

        <div class="form-group">
          <label>Difficult Airway / Special Procedures</label>
          <input type="text" id="difficultAirwayNotes" placeholder="e.g. C-MAC D-blade, Bougie, Arterial line">
        </div>

        <div class="form-group">
          <label>Complications & Critical Events</label>
          <input type="text" id="complicationsNotes" placeholder="e.g. Nil, transient hypotension">
        </div>

        <!-- Attachment -->
        <div class="form-group">
          <label>Attach OT Sheet Photo / PDF</label>
          <input type="file" id="fileUpload" accept="image/*,application/pdf" style="padding:8px 0;">
          <div id="existingLinkContainer" style="display:none; margin-top:6px;">
            <a id="existingLink" href="#" target="_blank" class="action-btn btn-view-doc">View Current Uploaded File</a>
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="saveCaseBtn" onclick="saveCase()">
          <i class="fa-solid fa-floppy-disk"></i> <span id="saveBtnText">Save & Log Case</span>
        </button>
        <button type="button" class="btn btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">
          Cancel Edit
        </button>
      </div>
    </div>

    <!-- Tab 2: Ledger -->
    <div id="tabLedger" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="font-size:1.15rem;">My Logbook Records</h2>
        <button type="button" onclick="exportCSV()" class="action-btn btn-edit">
          <i class="fa-solid fa-file-csv"></i> Export CSV
        </button>
      </div>
      <div id="caseListContainer"></div>
    </div>

    <!-- Tab 3: Settings -->
    <div id="tabSettings" style="display:none;">
      <div class="card">
        <h2 style="font-size:1.15rem; margin-bottom: 12px;">Google Drive Settings</h2>
        <div class="form-group">
          <label>Google Apps Script Web App URL</label>
          <input type="url" id="scriptUrlSetting" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <button type="button" class="btn btn-primary" onclick="saveSettings()">Save URL</button>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation with Inline Direct Handlers -->
  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" id="btnNavLog" onclick="showTab('tabLogger')">
      <i class="fa-solid fa-notes-medical"></i>
      <span>Log Case</span>
    </button>
    <button type="button" class="nav-btn" id="btnNavLedger" onclick="showTab('tabLedger')">
      <i class="fa-solid fa-book-medical"></i>
      <span>Ledger</span>
    </button>
    <button type="button" class="nav-btn" id="btnNavSettings" onclick="showTab('tabSettings')">
      <i class="fa-solid fa-gear"></i>
      <span>Settings</span>
    </button>
  </nav>

  <script>
    // Tab Switching (Direct Display Toggle)
    function showTab(tabId) {
      document.getElementById('tabLogger').style.display = (tabId === 'tabLogger') ? 'block' : 'none';
      document.getElementById('tabLedger').style.display = (tabId === 'tabLedger') ? 'block' : 'none';
      document.getElementById('tabSettings').style.display = (tabId === 'tabSettings') ? 'block' : 'none';

      document.getElementById('btnNavLog').classList.toggle('active', tabId === 'tabLogger');
      document.getElementById('btnNavLedger').classList.toggle('active', tabId === 'tabLedger');
      document.getElementById('btnNavSettings').classList.toggle('active', tabId === 'tabSettings');

      if (tabId === 'tabLedger') {
        renderLedger();
      }
      window.scrollTo(0, 0);
    }

    // Set Default Date
    document.getElementById('caseDate').value = new Date().toISOString().split('T')[0];
    const SCRIPT_URL_KEY = "etherlog_script_url";
    document.getElementById('scriptUrlSetting').value = localStorage.getItem(SCRIPT_URL_KEY) || "";

    let existingAttachmentUrl = "";

    // Save Case
    async function saveCase() {
      const proc = document.getElementById('procedureName').value.trim();
      if (!proc) {
        alert("Please enter surgical procedure");
        return;
      }

      const saveBtn = document.getElementById('saveCaseBtn');
      const saveBtnText = document.getElementById('saveBtnText');
      saveBtn.disabled = true;
      saveBtnText.textContent = "Saving...";

      let driveLink = existingAttachmentUrl;
      const fileInput = document.getElementById('fileUpload');
      const scriptUrl = localStorage.getItem(SCRIPT_URL_KEY);

      if (fileInput.files.length > 0 && scriptUrl) {
        saveBtnText.textContent = "Uploading to Drive...";
        try {
          const file = fileInput.files[0];
          const base64 = await toBase64(file);
          const payload = {
            fileName: `Case_${Date.now()}_${file.name.replace(/\s+/g, '_')}`,
            mimeType: file.type,
            base64Data: base64.split(',')[1]
          };
          const res = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
          const json = await res.json();
          if (json.status === "success") driveLink = json.viewUrl;
        } catch (e) {
          console.error(e);
        }
      }

      // Collect Radio / Checkboxes
      const selectedASA = document.querySelector('input[name="asaRadio"]:checked')?.value || "I";
      const comorbids = [];
      document.querySelectorAll('input[name="comorbidBox"]:checked').forEach(cb => comorbids.push(cb.value));
      const other = document.getElementById('comorbidOther').value.trim();
      if (other) comorbids.push(other);

      const editId = document.getElementById('editCaseId').value;
      const cases = JSON.parse(localStorage.getItem('etherlog_cases') || '[]');

      const record = {
        id: editId || ("CASE-" + Date.now()),
        date: document.getElementById('caseDate').value,
        priority: document.getElementById('casePriority').value,
        age: document.getElementById('patientAge').value || "N/A",
        sex: document.getElementById('patientSex').value,
        procedure: proc,
        specialty: document.getElementById('surgicalSpecialty').value,
        supervision: document.getElementById('supervision').value,
        asa: selectedASA,
        comorbidities: comorbids.join(', ') || 'None',
        technique: document.getElementById('technique').value,
        airway: document.getElementById('airwayNotes').value || 'Routine',
        difficultAirway: document.getElementById('difficultAirwayNotes').value || 'None',
        complications: document.getElementById('complicationsNotes').value || 'None',
        attachmentUrl: driveLink
      };

      if (editId) {
        const idx = cases.findIndex(c => c.id === editId);
        if (idx !== -1) cases[idx] = record;
      } else {
        cases.unshift(record);
      }

      localStorage.setItem('etherlog_cases', JSON.stringify(cases));
      resetForm();
      saveBtn.disabled = false;
      saveBtnText.textContent = "Save & Log Case";
      alert("Saved successfully!");
      showTab('tabLedger');
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function resetForm() {
      document.getElementById('editCaseId').value = "";
      document.getElementById('formTitle').textContent = "Log Anesthetic Case";
      document.getElementById('saveBtnText').textContent = "Save & Log Case";
      document.getElementById('cancelEditBtn').style.display = "none";
      document.getElementById('procedureName').value = "";
      document.getElementById('patientAge').value = "";
      document.getElementById('comorbidOther').value = "";
      document.getElementById('airwayNotes').value = "";
      document.getElementById('difficultAirwayNotes').value = "";
      document.getElementById('complicationsNotes').value = "";
      document.getElementById('fileUpload').value = "";
      document.getElementById('existingLinkContainer').style.display = "none";
      existingAttachmentUrl = "";
      
      document.querySelectorAll('input[name="comorbidBox"]').forEach(cb => cb.checked = false);
      const firstAsa = document.querySelector('input[name="asaRadio"][value="I"]');
      if (firstAsa) firstAsa.checked = true;
    }

    function cancelEdit() {
      resetForm();
      showTab('tabLedger');
    }

    function editCase(caseId) {
      const cases = JSON.parse(localStorage.getItem('etherlog_cases') || '[]');
      const item = cases.find(c => c.id === caseId);
      if (!item) return;

      document.getElementById('editCaseId').value = item.id;
      document.getElementById('formTitle').textContent = "Edit Case Record";
      document.getElementById('saveBtnText').textContent = "Update Case";
      document.getElementById('cancelEditBtn').style.display = "block";

      document.getElementById('caseDate').value = item.date;
      document.getElementById('casePriority').value = item.priority || "Elective";
      document.getElementById('patientAge').value = item.age !== "N/A" ? item.age : "";
      document.getElementById('patientSex').value = item.sex || "Male";
      document.getElementById('procedureName').value = item.procedure;
      document.getElementById('surgicalSpecialty').value = item.specialty;
      document.getElementById('supervision').value = item.supervision;
      document.getElementById('technique').value = item.technique;
      document.getElementById('airwayNotes').value = item.airway || "";
      document.getElementById('difficultAirwayNotes').value = item.difficultAirway || "";
      document.getElementById('complicationsNotes').value = item.complications || "";

      // Set ASA radio
      const radio = document.querySelector(`input[name="asaRadio"][value="${item.asa}"]`);
      if (radio) radio.checked = true;

      // Set Comorbidities
      const list = (item.comorbidities || "").split(', ').map(s => s.trim());
      document.querySelectorAll('input[name="comorbidBox"]').forEach(cb => {
        cb.checked = list.includes(cb.value);
      });

      existingAttachmentUrl = item.attachmentUrl || "";
      if (existingAttachmentUrl) {
        document.getElementById('existingLinkContainer').style.display = "block";
        document.getElementById('existingLink').href = existingAttachmentUrl;
      } else {
        document.getElementById('existingLinkContainer').style.display = "none";
      }

      showTab('tabLogger');
    }

    function deleteCase(caseId) {
      if (confirm("Delete this case?")) {
        let cases = JSON.parse(localStorage.getItem('etherlog_cases') || '[]');
        cases = cases.filter(c => c.id !== caseId);
        localStorage.setItem('etherlog_cases', JSON.stringify(cases));
        renderLedger();
      }
    }

    function renderLedger() {
      const container = document.getElementById('caseListContainer');
      const cases = JSON.parse(localStorage.getItem('etherlog_cases') || '[]');
      if (cases.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding:30px;">No cases recorded yet.</p>';
        return;
      }
      container.innerHTML = cases.map(c => `
        <div class="case-item">
          <div class="case-header">
            <strong>${c.procedure}</strong>
            <div>
              <span class="badge ${c.priority === 'Emergency' ? 'badge-emergency' : 'badge-elective'}">${c.priority || 'Elective'}</span>
              <span class="badge" style="background:#e0f2fe; color:#0369a1;">ASA ${c.asa}</span>
            </div>
          </div>
          <div style="font-size:0.82rem; color:#64748b; margin:6px 0;">
            ${c.date} | ${c.age} Y / ${c.sex} | ${c.specialty}
          </div>
          <p style="font-size:0.85rem;"><strong>Technique:</strong> ${c.technique} (${c.supervision})</p>
          <div class="details-box">
            <div><strong>Comorbidities:</strong> ${c.comorbidities || 'None'}</div>
            <div><strong>Airway:</strong> ${c.airway || 'Routine'}</div>
            ${c.difficultAirway && c.difficultAirway !== 'None' ? `<div><strong>Difficult Airway / Proc:</strong> ${c.difficultAirway}</div>` : ''}
            <div><strong>Complications:</strong> ${c.complications || 'None'}</div>
          </div>
          <div>
            ${c.attachmentUrl ? `<a href="${c.attachmentUrl}" target="_blank" class="action-btn btn-view-doc"><i class="fa-solid fa-image"></i> View OT Sheet</a>` : ''}
            <button type="button" onclick="editCase('${c.id}')" class="action-btn btn-edit"><i class="fa-solid fa-pen"></i> Edit</button>
            <button type="button" onclick="deleteCase('${c.id}')" class="action-btn btn-delete"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        </div>
      `).join('');
    }

    function saveSettings() {
      localStorage.setItem(SCRIPT_URL_KEY, document.getElementById('scriptUrlSetting').value.trim());
      alert("Settings saved!");
    }

    function exportCSV() {
      const cases = JSON.parse(localStorage.getItem('etherlog_cases') || '[]');
      if (cases.length === 0) return alert("No cases to export!");
      let csv = "Date,Priority,Age,Sex,Procedure,Specialty,Supervision,ASA,Comorbidities,Technique,Airway,DifficultAirway,Complications,OT_Record_Drive_URL\n";
      cases.forEach(c => {
        csv += `"${c.date}","${c.priority || ''}","${c.age || ''}","${c.sex || ''}","${c.procedure}","${c.specialty}","${c.supervision}","${c.asa}","${c.comorbidities || ''}","${c.technique}","${c.airway || ''}","${c.difficultAirway || ''}","${c.complications || ''}","${c.attachmentUrl || ''}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Anesthesia_Logbook_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }
  </script>
</body>
</html>
